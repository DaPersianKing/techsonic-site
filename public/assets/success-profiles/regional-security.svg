<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Managed response responsibility model</title><desc id="desc">Conceptual evaluation path based on supplied engagement scope. Security requirements to MDR service evaluation to Response operating model. Not an as-built deployment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#168078" stroke-width="2"/></marker></defs><rect width="900" height="320" fill="#edf2f1"/><g font-family="Arial,sans-serif" fill="#101820"><text x="28" y="42" font-size="11" fill="#005daa" letter-spacing="2">CONCEPTUAL EVALUATION PATH</text><text x="28" y="78" font-size="23">Managed response responsibility model</text><rect x="28" y="116" width="256" height="106" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="44" y="143" font-size="11" fill="#005daa">01</text><text x="44" y="170" font-size="15" font-weight="600">Security requirements</text><text x="44" y="198" font-size="11" fill="#52616b">Scope + telemetry needs</text><path d="M288 169h26" stroke="#168078" stroke-width="2" marker-end="url(#arrow)"/><rect x="322" y="116" width="256" height="106" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="338" y="143" font-size="11" fill="#005daa">02</text><text x="338" y="170" font-size="15" font-weight="600">MDR service evaluation</text><text x="338" y="198" font-size="11" fill="#52616b">Monitoring + triage + escalation</text><path d="M582 169h26" stroke="#168078" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="116" width="256" height="106" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="632" y="143" font-size="11" fill="#005daa">03</text><text x="632" y="170" font-size="15" font-weight="600">Response operating model</text><text x="632" y="198" font-size="11" fill="#52616b">Customer approvals + ownership</text><text x="28" y="276" font-size="12" fill="#52616b">Requirements → evaluation → decision. Implementation is not asserted.</text></g></svg>
