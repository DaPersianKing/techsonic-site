<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">Distributed sourcing evaluation</title><desc id="desc">Conceptual evaluation path. Location requirements to Qualification matrix to Procurement decision. Not an as-built deployment.</desc><rect width="360" height="560" fill="#edf2f1"/><g font-family="Arial,sans-serif" fill="#101820"><text x="20" y="34" font-size="12" fill="#005daa">CONCEPTUAL EVALUATION PATH</text><text x="20" y="57" font-size="12" fill="#52616b">Requirements · evaluation · decision</text><rect x="20" y="84" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="112" font-size="12" fill="#005daa">01</text><text x="38" y="141" font-size="16" font-weight="600">Location requirements</text><text x="38" y="168" font-size="12" fill="#52616b">Operating needs + service scope</text><path d="M180 200v24m-5-5 5 5 5-5" fill="none" stroke="#168078" stroke-width="2"/><rect x="20" y="230" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="258" font-size="12" fill="#005daa">02</text><text x="38" y="287" font-size="16" font-weight="600">Qualification matrix</text><text x="38" y="314" font-size="12" fill="#52616b">Carrier evidence + comparable bids</text><path d="M180 346v24m-5-5 5 5 5-5" fill="none" stroke="#168078" stroke-width="2"/><rect x="20" y="376" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="404" font-size="12" fill="#005daa">03</text><text x="38" y="433" font-size="16" font-weight="600">Procurement decision</text><text x="38" y="460" font-size="12" fill="#52616b">Terms + ownership + transition</text><text x="20" y="526" font-size="12" fill="#52616b">Not an as-built deployment.</text></g></svg>
