<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" role="img" aria-labelledby="title desc"><title id="title">Managed response responsibility model</title><desc id="desc">Conceptual evaluation path. Security requirements to MDR service evaluation to Response operating model. Not an as-built deployment.</desc><rect width="360" height="560" fill="#edf2f1"/><g font-family="Arial,sans-serif" fill="#101820"><text x="20" y="34" font-size="12" fill="#005daa">CONCEPTUAL EVALUATION PATH</text><text x="20" y="57" font-size="12" fill="#52616b">Requirements · evaluation · decision</text><rect x="20" y="84" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="112" font-size="12" fill="#005daa">01</text><text x="38" y="141" font-size="16" font-weight="600">Security requirements</text><text x="38" y="168" font-size="12" fill="#52616b">Scope + telemetry needs</text><path d="M180 200v24m-5-5 5 5 5-5" fill="none" stroke="#168078" stroke-width="2"/><rect x="20" y="230" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="258" font-size="12" fill="#005daa">02</text><text x="38" y="287" font-size="16" font-weight="600">MDR service evaluation</text><text x="38" y="314" font-size="12" fill="#52616b">Monitoring + triage + escalation</text><path d="M180 346v24m-5-5 5 5 5-5" fill="none" stroke="#168078" stroke-width="2"/><rect x="20" y="376" width="320" height="110" rx="4" fill="#fff" stroke="#a8bbc7"/><text x="38" y="404" font-size="12" fill="#005daa">03</text><text x="38" y="433" font-size="16" font-weight="600">Response operating model</text><text x="38" y="460" font-size="12" fill="#52616b">Customer approvals + ownership</text><text x="20" y="526" font-size="12" fill="#52616b">Not an as-built deployment.</text></g></svg>
