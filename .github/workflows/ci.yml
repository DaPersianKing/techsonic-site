name: Validate Techsonic
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/techsonic-v2-redesign]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: npm audit --audit-level=moderate
